<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc"><title id="title">AWS × Apache Iceberg 検証環境の構成図</title><desc id="desc">利用者がAthenaへSQLを実行し、AthenaがGlue Data Catalogのテーブル登録情報を参照更新して、通常のS3バケット内のIcebergファイルを読み書きする。クエリ結果は別のS3バケットに保存する。CloudFormationの作成範囲とSQL実行後に作られるものを区別。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#40658c" stroke-width="1.6"/></marker><marker id="ref" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#b0782d" stroke-width="1.6"/></marker></defs><style>text {font-family: "Noto Sans CJK JP", sans-serif;}</style><rect x="0" y="0" width="1800" height="1220" rx="0" fill="#fff" stroke="#fff" stroke-width="2"/><text x="50" y="68" font-size="38" fill="#203249" font-weight="700" text-anchor="start">AWS × Apache Iceberg｜検証環境の構成</text><text x="50" y="112" font-size="24" fill="#5c6c80" font-weight="400" text-anchor="start">SQLの実行・カタログ・ファイル保存を分けて確認する最小構成</text><rect x="280" y="160" width="1470" height="970" rx="18" fill="#f8fafd" stroke="#354d6a" stroke-width="2"/><text x="315" y="210" font-size="28" fill="#203249" font-weight="700" text-anchor="start">AWSアカウント</text><text x="315" y="250" font-size="22" fill="#5c6c80" font-weight="400" text-anchor="start">シドニーリージョン  ap-southeast-2</text><rect x="960" y="285" width="740" height="170" rx="16" fill="#f5f0fc" stroke="#8a64bb" stroke-width="2"/><rect x="988" y="311" width="48" height="48" rx="10" fill="#6b45b0" stroke="#6b45b0" stroke-width="2"/><text x="1012" y="344" font-size="23" fill="white" font-weight="700" text-anchor="middle">C</text><text x="1054" y="344" font-size="29" fill="#203249" font-weight="700" text-anchor="start">AWS Glue Data Catalog</text><text x="988" y="391" font-size="23" fill="#203249" font-weight="400" text-anchor="start">Database: lakehouse_lab   /   Table: orders</text><text x="988" y="429" font-size="22" fill="#5b4974" font-weight="400" text-anchor="start">スキーマ・テーブル登録情報・metadata_location</text><rect x="350" y="485" width="440" height="255" rx="16" fill="#f4f0fc" stroke="#8a64bb" stroke-width="2"/><rect x="378" y="511" width="48" height="48" rx="10" fill="#6b45b0" stroke="#6b45b0" stroke-width="2"/><text x="402" y="544" font-size="23" fill="white" font-weight="700" text-anchor="middle">Q</text><text x="444" y="544" font-size="30" fill="#203249" font-weight="700" text-anchor="start">Amazon Athena</text><text x="378" y="589" font-size="23" fill="#203249" font-weight="400" text-anchor="start">engine version 3</text><text x="378" y="631" font-size="21" fill="#203249" font-weight="400" text-anchor="start">Workgroup: lakehouse-lab-wg</text><text x="378" y="675" font-size="21" fill="#5b4974" font-weight="400" text-anchor="start">SQL実行・Iceberg形式の読み書き</text><text x="378" y="712" font-size="19" fill="#5b4974" font-weight="400" text-anchor="start">SELECT / INSERT / UPDATE / DELETE</text><rect x="960" y="565" width="740" height="300" rx="16" fill="#f0f8f2" stroke="#5c966c" stroke-width="2"/><rect x="988" y="588" width="48" height="48" rx="10" fill="#447f52" stroke="#447f52" stroke-width="2"/><text x="1012" y="621" font-size="23" fill="white" font-weight="700" text-anchor="middle">S3</text><text x="1054" y="621" font-size="29" fill="#203249" font-weight="700" text-anchor="start">Amazon S3｜データ用バケット</text><text x="988" y="660" font-size="22" fill="#376343" font-weight="400" text-anchor="start">warehouse/orders/  ─  Apache Iceberg 形式 v2</text><rect x="988" y="680" width="684" height="78" rx="9" fill="#fff" stroke="#b4d1bc" stroke-width="2"/><text x="1008" y="711" font-size="23" fill="#203249" font-weight="700" text-anchor="start">metadata/  メタデータJSON・Avro</text><text x="1008" y="741" font-size="21" fill="#557260" font-weight="400" text-anchor="start">スナップショット・Manifest List・Manifest</text><rect x="988" y="774" width="684" height="66" rx="9" fill="#fff" stroke="#b4d1bc" stroke-width="2"/><text x="1008" y="803" font-size="22" fill="#203249" font-weight="700" text-anchor="start">data/  Parquetデータ・Position Deleteファイル</text><text x="1008" y="829" font-size="19" fill="#557260" font-weight="400" text-anchor="start">Athenaは削除情報を適用して現在の行を返す</text><rect x="350" y="855" width="440" height="145" rx="16" fill="#f0f8f2" stroke="#5c966c" stroke-width="2"/><rect x="378" y="880" width="48" height="48" rx="10" fill="#447f52" stroke="#447f52" stroke-width="2"/><text x="402" y="913" font-size="23" fill="white" font-weight="700" text-anchor="middle">S3</text><text x="444" y="913" font-size="25" fill="#203249" font-weight="700" text-anchor="start">Amazon S3｜クエリ結果用</text><text x="378" y="958" font-size="21" fill="#376343" font-weight="400" text-anchor="start">athena-results/   ・   7日後に期限切れ</text><rect x="35" y="532" width="200" height="158" rx="16" fill="#f0f4f9" stroke="#8293a8" stroke-width="2"/><text x="135" y="582" font-size="29" fill="#203249" font-weight="700" text-anchor="middle">利用者</text><text x="135" y="623" font-size="19" fill="#203249" font-weight="400" text-anchor="middle">Athenaコンソール</text><text x="135" y="658" font-size="19" fill="#5c6c80" font-weight="400" text-anchor="middle">既存のIAM権限</text><path d="M235 611 H350" fill="none" stroke="#40658c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="292" y="592" font-size="22" fill="#203249" font-weight="400" text-anchor="middle">SQL</text><path d="M790 519 H860 V370 H960" fill="none" stroke="#40658c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="810" y="316" font-size="20" fill="#203249" font-weight="400" text-anchor="middle">登録情報の</text><text x="810" y="346" font-size="20" fill="#203249" font-weight="400" text-anchor="middle">取得・更新</text><path d="M790 647 H960" fill="none" stroke="#40658c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="875" y="608" font-size="20" fill="#203249" font-weight="400" text-anchor="middle">ファイル</text><text x="875" y="635" font-size="20" fill="#203249" font-weight="400" text-anchor="middle">読み書き</text><path d="M570 740 V855" fill="none" stroke="#40658c" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="590" y="795" font-size="22" fill="#203249" font-weight="400" text-anchor="start">実行結果の保存</text><path d="M1390 455 V565" fill="none" stroke="#b0782d" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#ref)"/><text x="1410" y="502" font-size="22" fill="#8a5c20" font-weight="400" text-anchor="start">metadata_location</text><text x="1410" y="534" font-size="19" fill="#8a5c20" font-weight="400" text-anchor="start">S3上のメタデータへの参照</text><rect x="315" y="1035" width="1398" height="65" rx="10" fill="#fff8eb" stroke="#d49b42" stroke-width="2" stroke-dasharray="8 5"/><text x="339" y="1077" font-size="23" fill="#80551b" font-weight="700" text-anchor="start">CloudFormationで作成：S3 × 2 ／ Glue DB ／ Athena Workgroup ／ 保存済みSQL 9本</text><text x="50" y="1170" font-size="21" fill="#53677d" font-weight="400" text-anchor="start">実線：操作の向き（読み取り結果の戻り矢印は省略）   破線：参照関係</text><text x="50" y="1204" font-size="20" fill="#53677d" font-weight="400" text-anchor="start">ordersテーブルとIcebergファイルはSQL実行時に作成。VPC・EC2・Glue ETLジョブは今回作成しない。</text></svg>